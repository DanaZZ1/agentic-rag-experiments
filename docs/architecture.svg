<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 640" font-family="-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#57606a"/>
    </marker>
    <marker id="arrowLoop" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#bc4c00"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1120" height="640" fill="#ffffff"/>
  <text x="40" y="46" font-size="26" font-weight="700" fill="#1f2328">production-agentic-rag</text>
  <text x="40" y="70" font-size="14" fill="#57606a">provider-agnostic · offline-deterministic · evaluated · observable</text>

  <!-- Ingestion column -->
  <rect x="40" y="110" width="150" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="115" y="140" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Corpus</text>
  <text x="115" y="160" font-size="12" fill="#57606a" text-anchor="middle">md / txt docs</text>

  <line x1="190" y1="145" x2="222" y2="145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <rect x="226" y="110" width="160" height="70" rx="10" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="306" y="138" font-size="14" font-weight="600" fill="#1f2328" text-anchor="middle">Ingestion</text>
  <text x="306" y="158" font-size="11.5" fill="#57606a" text-anchor="middle">loaders · chunking</text>
  <text x="306" y="172" font-size="11.5" fill="#57606a" text-anchor="middle">(fixed · section)</text>

  <line x1="386" y1="145" x2="420" y2="145" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Pipeline container -->
  <rect x="424" y="92" width="656" height="300" rx="14" fill="#ffffff" stroke="#54aeff" stroke-width="1.5"/>
  <text x="444" y="116" font-size="13" font-weight="700" fill="#0969da">RAGPipeline</text>

  <!-- Input guardrails -->
  <rect x="444" y="130" width="120" height="60" rx="9" fill="#fff1e5" stroke="#f0a868"/>
  <text x="504" y="155" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Input</text>
  <text x="504" y="172" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">guardrails</text>

  <line x1="564" y1="160" x2="592" y2="160" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Agentic loop box -->
  <rect x="596" y="128" width="316" height="210" rx="11" fill="#ddf4ff" stroke="#54aeff"/>
  <text x="612" y="148" font-size="12.5" font-weight="700" fill="#0969da">Agentic loop</text>

  <rect x="614" y="158" width="280" height="34" rx="7" fill="#ffffff" stroke="#aac7e8"/>
  <text x="754" y="180" font-size="12" fill="#1f2328" text-anchor="middle">① Plan — decompose into sub-questions</text>

  <rect x="614" y="200" width="280" height="52" rx="7" fill="#ffffff" stroke="#aac7e8"/>
  <text x="754" y="220" font-size="12" fill="#1f2328" text-anchor="middle">② Hybrid retrieve (multi-hop)</text>
  <text x="754" y="238" font-size="11" fill="#57606a" text-anchor="middle">BM25 + dense → RRF fuse → rerank</text>

  <rect x="614" y="260" width="280" height="34" rx="7" fill="#ffffff" stroke="#aac7e8"/>
  <text x="754" y="282" font-size="12" fill="#1f2328" text-anchor="middle">③ Synthesize (LLM) + cite</text>

  <rect x="614" y="302" width="280" height="30" rx="7" fill="#fbeff2" stroke="#e5808f"/>
  <text x="754" y="322" font-size="11.5" fill="#1f2328" text-anchor="middle">④ Faithfulness gate (τ)</text>

  <!-- self-correct loop arrow -->
  <path d="M614,317 C586,317 586,175 612,175" fill="none" stroke="#bc4c00" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowLoop)"/>
  <text x="556" y="250" font-size="10.5" fill="#bc4c00" text-anchor="middle" transform="rotate(-90 556 250)">self-correct ↺</text>

  <!-- Output guardrails -->
  <rect x="444" y="220" width="120" height="60" rx="9" fill="#fff1e5" stroke="#f0a868"/>
  <text x="504" y="245" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Output</text>
  <text x="504" y="262" font-size="11" fill="#1f2328" text-anchor="middle">PII · grounding</text>
  <path d="M754,338 C754,360 504,352 504,282" fill="none" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Answer out -->
  <line x1="424" y1="250" x2="392" y2="250" stroke="#57606a" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="226" y="218" width="160" height="64" rx="10" fill="#dafbe1" stroke="#4ac26b"/>
  <text x="306" y="244" font-size="13" font-weight="600" fill="#1f2328" text-anchor="middle">Answer</text>
  <text x="306" y="263" font-size="11.5" fill="#57606a" text-anchor="middle">+ citations · faithfulness</text>

  <!-- Cross-cutting band -->
  <rect x="40" y="430" width="1040" height="86" rx="12" fill="#f6f8fa" stroke="#d0d7de"/>
  <text x="58" y="454" font-size="12.5" font-weight="700" fill="#57606a">CROSS-CUTTING</text>

  <rect x="58" y="464" width="230" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="173" y="482" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Providers</text>
  <text x="173" y="497" font-size="11" fill="#57606a" text-anchor="middle">mock · openai · azure</text>

  <rect x="300" y="464" width="250" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="425" y="482" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Observability</text>
  <text x="425" y="497" font-size="11" fill="#57606a" text-anchor="middle">spans · tokens · USD cost</text>

  <rect x="562" y="464" width="300" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="712" y="482" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Evaluation harness</text>
  <text x="712" y="497" font-size="11" fill="#57606a" text-anchor="middle">hit@k · MRR · nDCG · faithfulness · F1</text>

  <rect x="874" y="464" width="188" height="40" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="968" y="482" font-size="12" font-weight="600" fill="#1f2328" text-anchor="middle">Interfaces</text>
  <text x="968" y="497" font-size="11" fill="#57606a" text-anchor="middle">CLI · FastAPI · Docker</text>

  <!-- Optional integrations -->
  <rect x="40" y="540" width="1040" height="64" rx="12" fill="#ffffff" stroke="#d8b9ff"/>
  <text x="58" y="564" font-size="12.5" font-weight="700" fill="#8250df">OPTIONAL INTEGRATIONS</text>
  <rect x="58" y="572" width="330" height="26" rx="7" fill="#faf5ff" stroke="#d8b9ff"/>
  <text x="223" y="589" font-size="11.5" fill="#1f2328" text-anchor="middle">mcp-tool-gateway → secure tool plane (JWT · inspect · audit)</text>
  <rect x="400" y="572" width="300" height="26" rx="7" fill="#faf5ff" stroke="#d8b9ff"/>
  <text x="550" y="589" font-size="11.5" fill="#1f2328" text-anchor="middle">llm-observability → token / cost / eval reporting</text>
</svg>
